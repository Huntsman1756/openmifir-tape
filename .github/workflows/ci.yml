# CI for OpenMiFIR Tape - deterministic, OFFLINE, fixture-based tests only.
# CI MUST NOT make network requests to any data provider. The acquisition CLI
# (collectors/cli.py) and live adapters are NOT exercised here; tests use
# synthetic fixtures and injected HTTP, so they never touch BME/Bloomberg.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to full-length commit SHAs (supply-chain hygiene).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Repository hygiene (no provider payloads, no secrets)
        run: python tools/check_hygiene.py
      - name: Test (offline)
        run: python -m pytest
