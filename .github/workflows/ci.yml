# CI for OpenMiFIR Tape - deterministic, OFFLINE, fixture-based tests only.
# CI MUST NOT make network requests to any data provider. The acquisition CLI
# (collectors/cli.py) and live adapters are NOT exercised here; tests use
# synthetic fixtures and injected HTTP, so they never touch BME/Bloomberg.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml ruff pytest
      - name: Lint
        run: ruff check collectors tests
      - name: Test (offline)
        run: python -m pytest
