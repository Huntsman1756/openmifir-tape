findings:
  - id: F-001
    title: BME free-JSON listing resolved (was a blocker, now RESOLVED)
    severity: RESOLVED
    detail: >-
      The BME delayed/free post-trade JSON listing is now a deterministic,
      observed machine route: the page's own JS bundle fetches
      `${componentPath}.results.json`. Frozen into
      config/sources/bme_apa.yaml entrypoint.listing_url with provenance. No URL
      was guessed. BME acquired successfully.
  - id: F-002
    title: Windows raw-capture byte corruption (O_BINARY) - FIXED
    severity: FIXED
    detail: >-
      On Windows, os.open defaults to text mode without O_BINARY, causing
      os.write to translate LF->CRLF and inflate/alter the exact captured bytes
      (observed 1992B -> 2008B, sha mismatch). This initially masqueraded as a
      "source regenerates content" conflict. Fixed by adding os.O_BINARY
      (no-op on POSIX); covered by a byte-exactness regression test. Raw objects
      are now verified byte-for-byte (file sha == recorded raw_sha256).
  - id: F-003
    title: Storage identity model separates source_object_id from capture_version
    severity: DESIGN
    detail: >-
      Raw layout is now
      data/raw/<source_id>/<publication_date>/<source_object_id>/<capture_version>
      with invariants (same id+same bytes -> ALREADY_PRESENT; same id+different
      bytes -> new immutable version, original preserved; same version+different
      bytes -> WriteOnceConflict). Keeps SOURCE REOBSERVATION (G0-A1) distinct
      from INGEST IDEMPOTENCE (G0-A2).

