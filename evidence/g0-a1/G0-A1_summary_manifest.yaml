findings:
  - id: F-001
    title: BME free-JSON listing resolved (was a blocker, now RESOLVED)
    severity: RESOLVED
    detail: >-
      The BME delayed/free post-trade JSON listing is now a deterministic,
      observed machine route: the page's own JS bundle fetches
      `${componentPath}.results.json`. Frozen into
      config/sources/bme_apa.yaml entrypoint.listing_url with provenance. No URL
      was guessed. BME acquired successfully.
  - id: F-002
    title: Windows raw-capture byte corruption (newline translation) - FIXED
    severity: FIXED
    detail: >-
      On Windows, opening a file without binary mode causes newline translation
      (LF->CRLF), inflating/altering the exact captured bytes (observed 1992B ->
      2008B, sha mismatch). This initially masqueraded as a "source regenerates
      content" conflict. Fixed with the portable exclusive-create binary mode
      open(path, "xb"), which also removes the Windows-only os.O_BINARY symbol
      that would AttributeError on POSIX. Covered by a byte-exactness regression
      test. Raw objects are verified byte-for-byte (file sha == recorded
      raw_sha256).
  - id: F-003
    title: Storage identity model separates source_object_id from capture_version
    severity: DESIGN
    detail: >-
      Raw layout is now
      data/raw/<source_id>/<publication_date>/<source_object_id>/<capture_version>
      with invariants (same id+same bytes -> ALREADY_PRESENT; same id+different
      bytes -> new immutable version, original preserved; same version+different
      bytes -> WriteOnceConflict). Keeps SOURCE REOBSERVATION (G0-A1) distinct
      from INGEST IDEMPOTENCE (G0-A2).
  - id: F-004
    title: BME publicationDate semantics
    status: RESOLVED
    detail: >-
      Resolved 2026-09-15 (see evidence/g0-a1/F-004_publicationDate_resolution.yaml):
      publicationDate is a daily catalogue date (local-midnight boundary,
      Europe/Madrid), NOT the exact availability instant. Proof: 679/679 and
      287/287 captured records carry publication_date_and_time AFTER the listing
      timestamp, and the 2026-09-15 file was fetched mid-session already
      containing intraday records. The daily file mutates intraday under a fixed
      source_object_id; re-fetch yields a new immutable capture_version.
      G0-A3 rescan must re-fetch the current-day file on each poll.

