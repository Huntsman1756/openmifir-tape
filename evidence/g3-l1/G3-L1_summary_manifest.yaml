unresolved_items:
  - id: U-001
    item: SCHEMA_ARTIFACT_VENDORING
    why: >-
      ISO 20022's own terms point toward free reproduction with a non-official /
      sole-source statement, but the licence is to "use" with no express
      redistribution clause, ISO's site-wide copyright conflicts with it, and the
      artifact-specific pages (message-set/1253, submission-status/2838) returned
      HTTP 403 on 2026-10-17. Not PASS-verified, so vendoring stays UNRESOLVED.
  - id: U-002
    item: CTP_OUTPUT_REDISTRIBUTION
    why: >-
      No statutory prohibition or grant of republication; redistribution is a
      commercial licensing activity and the bonds CTP's market data policy is not
      yet published.
  - id: U-003
    item: iso20022_site_wide_ai_ml_restriction
    why: >-
      ISO's site-wide copyright restrictions on AI/ML use of ISO content may or
      may not reach the freely-reproducible ISO 20022 Repository artifacts; not
      established either way. Recorded as a limitation to track, not resolved.
  - id: U-004
    item: bonds_ctp_authorisation
    why: >-
      ESMA selected the bonds-tape applicant (Ediphy / fairCT) on 2025-07-03 but
      the authorisation process is still ongoing; no bonds-tape authorisation has
      been published. Selection is not authorisation.

findings:
  - id: F-001
    title: Repo alias is not the canonical citation
    severity: RESOLVED
    detail: >-
      The act called "mifir-rts-2025-3102" in this repository is Commission
      Delegated Regulation (EU) 2025/1155 (OJ L, 2025/1155, 3.11.2025). Its
      companion access act is (EU) 2025/1156. Use the OJ number as canonical.
  - id: F-002
    title: Input and output adherence to ISO 20022 is a regulatory requirement
    severity: RESOLVED
    detail: >-
      Input data must adhere to the ISO 20022 methodology; output must include a
      GUI plus at least CSV and an ISO-20022-methodology format. This grounds the
      G3 structural-projection scope without implying any conformance
      certification.
  - id: F-003
    title: Free-of-charge access is not a republication right
    severity: RESOLVED
    detail: >-
      Free access applies to retail investors, academics, civil society
      organisations and competent authorities (access, not redistribution).
      Republication depends on the CTP's market data terms.
  - id: F-004
    title: Derived message publication is fail-closed
    severity: RESOLVED
    detail: >-
      Projected instances would carry provider-derived economic values, already
      FAIL under G0-L1 for the observed BME source; the class is FAIL as-is and
      the projection emits no economic values.

