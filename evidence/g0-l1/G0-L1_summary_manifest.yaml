  # every artifact class carries an explicit status (no blank cells)

unresolved_items:
  - id: U-001
    item: blb_apae.linked_tos_content
    why: >-
      The page confirms Transparency Data is subject to a linked Terms of Use, but
      the linked page (https://www.bloomberg.com/tos/) returned HTTP 403 to the
      automated fetch on 2026-09-15. Exact ToS body is therefore UNRESOLVED, which
      propagates to the blb_apae redistribution classes and local-archival rights.
  - id: U-002
    item: bme_apa.free_delayed_redistribution
    why: >-
      The data notice conditions authorisation on commercial use and/or non-free
      redistribution, while the website-wide Legal Disclaimer forbids redistribution
      without prior written consent. Conflict; no explicit free-redistribution grant.
  - id: U-003
    item: blb_apae.local_archival
    why: >-
      Unauthenticated public file availability is not a licence; local-archival
      rights cannot be confirmed without the inaccessible ToS body.

findings:
  - id: F-001
    title: BME free JSON availability confirmed (availability, not redistribution licence)
    severity: RESOLVED
    detail: >-
      The BME post-trade page states the JSON is freely accessible and free of
      charge. That is an availability statement; the terms also restrict use to
      personal/internal purposes and gate commercial and non-free redistribution.
      Local archival PASS; redistribution classes flagged above.
  - id: F-002
    title: Bloomberg ToS link blocked
    severity: UNRESOLVED
    detail: >-
      bloomberg.com/tos returns HTTP 403 (bot-blocked). The page-level disclaimer
      with the EU Regulation 600/2014 consistency clause is captured; the ToS body
      is not. Revisit by a browser-capable fetch if the ToS is needed for a
      redistribution decision.

hygiene:
  provider_payloads_in_repo: false
  verbatim_tos_in_repo: false
  raw_directory_tracked: false
  notes: "docs/legal/ and evidence/g0-l1/ hold summaries, URLs, dates and statuses only."
